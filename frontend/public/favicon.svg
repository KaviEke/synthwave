<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="16" x2="48" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff00ff"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="sun" x1="14" y1="8" x2="34" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6ec7"/>
      <stop offset="100%" stop-color="#ff9a00"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="24" cy="24" r="23" fill="url(#bg)" stroke="url(#wave)" stroke-width="1.5"/>
  <!-- Synthwave sun -->
  <circle cx="24" cy="18" r="8" fill="url(#sun)" opacity="0.9"/>
  <!-- Sun horizontal lines (retro effect) -->
  <line x1="16" y1="16" x2="32" y2="16" stroke="#0f0c29" stroke-width="1.2" opacity="0.5"/>
  <line x1="16.5" y1="18.5" x2="31.5" y2="18.5" stroke="#0f0c29" stroke-width="1" opacity="0.4"/>
  <line x1="17" y1="21" x2="31" y2="21" stroke="#0f0c29" stroke-width="0.8" opacity="0.3"/>
  <!-- Audio waveform / synthwave lines -->
  <path d="M4 28 Q10 22, 16 28 T28 28 T40 28 L44 28" fill="none" stroke="url(#wave)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M4 32 Q10 27, 16 32 T28 32 T40 32 L44 32" fill="none" stroke="url(#wave)" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <path d="M4 36 Q10 32, 16 36 T28 36 T40 36 L44 36" fill="none" stroke="url(#wave)" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <!-- Perspective grid lines -->
  <line x1="8" y1="40" x2="24" y2="28" stroke="#7c4dff" stroke-width="0.5" opacity="0.3"/>
  <line x1="16" y1="42" x2="24" y2="28" stroke="#7c4dff" stroke-width="0.5" opacity="0.3"/>
  <line x1="32" y1="42" x2="24" y2="28" stroke="#7c4dff" stroke-width="0.5" opacity="0.3"/>
  <line x1="40" y1="40" x2="24" y2="28" stroke="#7c4dff" stroke-width="0.5" opacity="0.3"/>
</svg>